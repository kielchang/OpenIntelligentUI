<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppHeader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { background: var(--background); color: var(--text-primary); font-family: var(--font-sans); }
  .demo-note { padding: var(--space-3) var(--space-4); }
  .lm-demo-label { font: 400 12px/1.4 var(--font-sans); color: var(--text-secondary); margin: 0; }
</style>
</head>
<body>
  <header class="lm-header">
    <a class="lm-header__brand" href="#" aria-label="DOOPING 組織與人員">
      <span class="lm-header__wordmark">DOOPING</span>
      <span class="lm-header__divider" aria-hidden="true"></span>
      <span class="lm-header__module">組織與人員</span>
    </a>
    <nav class="lm-header__nav" aria-label="主導覽">
      <a class="lm-header__link" href="#" aria-current="page">組織圖</a>
      <a class="lm-header__link" href="#">人員</a>
      <a class="lm-header__link" href="#">草稿</a>
      <a class="lm-header__link" href="#">合規</a>
    </nav>
    <div class="lm-header__actions">
      <span class="lm-header__env" title="這是測試環境，資料為示意資料">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.5a1 1 0 0 0 .9 1.5h12.8a1 1 0 0 0 .9-1.5l-5.1-10.1a2 2 0 0 1-.2-.9V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>
        測試環境
      </span>
      <button type="button" class="lm-header__btn" aria-haspopup="menu" aria-expanded="false">
        <span class="lm-header__avatar" aria-hidden="true">美</span>
        樣本·美玲
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="lm-header__theme" role="group" aria-label="主題">
        <button type="button" class="lm-header__theme-btn" aria-pressed="true" title="淺色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="lm-sr-only">淺色</span>
        </button>
        <button type="button" class="lm-header__theme-btn" aria-pressed="false" title="深色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span class="lm-sr-only">深色</span>
        </button>
        <button type="button" class="lm-header__theme-btn" aria-pressed="false" title="跟隨系統">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span class="lm-sr-only">跟隨系統</span>
        </button>
      </div>
    </div>
  </header>
  <div class="demo-note">
    <p class="lm-demo-label">純文字字標（無 logo）＋模組名；當前頁 aria-current 底線；環境徽章 warning 低強度；主題切換 aria-pressed。</p>
  </div>
  <script>
    (function () {
      var group = document.querySelector(".lm-header__theme");
      if (!group) return;
      group.addEventListener("click", function (e) {
        var btn = e.target.closest(".lm-header__theme-btn");
        if (!btn) return;
        group.querySelectorAll(".lm-header__theme-btn").forEach(function (b) { b.setAttribute("aria-pressed", b === btn ? "true" : "false"); });
      });
    })();
  </script>
</body>
</html>
