<!-- @dsCard group="Diagram" height=350 -->
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiagramClasses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { background: var(--background); color: var(--text-primary); font-family: var(--font-sans); padding: var(--space-3) var(--space-4); }
  .lm-demo-label { display: block; font: 400 12px/1.4 var(--font-sans); color: var(--text-secondary); margin-bottom: var(--space-1); }
</style>
</head>
<body>
  <span class="lm-demo-label">.lm-diagram svg 內的 .box／.arr／.leader／.t／.ts／.th 與九色階 .c-&lt;name&gt;</span>
  <div class="lm-diagram">
    <h3 class="lm-diagram__title">草稿流程（三步）</h3>
    <svg viewBox="0 0 640 124" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="流程圖：送出草稿，經驗證，再排程生效；驗證是 dry-run，不寫入版本表">
      <defs>
        <marker id="lm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path class="arr-head" d="M2 1L8 5L2 9"/>
        </marker>
      </defs>
      <g class="box c-teal">
        <rect x="16" y="14" width="168" height="56" rx="8"/>
        <text class="th" x="100" y="34" text-anchor="middle" dominant-baseline="central">送出草稿</text>
        <text class="ts" x="100" y="54" text-anchor="middle" dominant-baseline="central">POST /drafts</text>
      </g>
      <line class="arr" x1="184" y1="42" x2="232" y2="42" marker-end="url(#lm-arrow)"/>
      <g class="box c-purple">
        <rect x="236" y="14" width="168" height="56" rx="8"/>
        <text class="th" x="320" y="34" text-anchor="middle" dominant-baseline="central">驗證</text>
        <text class="ts" x="320" y="54" text-anchor="middle" dominant-baseline="central">validate（dry-run）</text>
      </g>
      <line class="arr" x1="404" y1="42" x2="452" y2="42" marker-end="url(#lm-arrow)"/>
      <g class="box c-amber">
        <rect x="456" y="14" width="168" height="56" rx="8"/>
        <text class="th" x="540" y="34" text-anchor="middle" dominant-baseline="central">排程生效</text>
        <text class="ts" x="540" y="54" text-anchor="middle" dominant-baseline="central">POST /drafts/:id/schedule</text>
      </g>
      <polyline class="leader" points="320,70 320,96 344,96"/>
      <text class="ts" x="350" y="96" dominant-baseline="central">dry-run：只回報發現，不寫入版本表</text>
      <polyline class="leader" points="540,70 540,110"/>
      <text class="t" x="540" y="118" text-anchor="middle" dominant-baseline="central">版本表的唯一寫入入口</text>
    </svg>
    <p class="lm-diagram__caption">.box 以 .arr（marker-end 箭頭、currentColor）相連；.leader 虛線接註記文字 .ts／.t</p>
    <h3 class="lm-diagram__title">九色階 .c-&lt;name&gt;</h3>
    <svg viewBox="0 0 640 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="九個色階方塊：purple、teal、coral、pink、gray、blue、green、amber、red">
      <g class="c-purple"><rect x="0" y="4" width="64" height="36" rx="6"/><text class="t" x="32" y="22" text-anchor="middle" dominant-baseline="central">purple</text></g>
      <g class="c-teal"><rect x="72" y="4" width="64" height="36" rx="6"/><text class="t" x="104" y="22" text-anchor="middle" dominant-baseline="central">teal</text></g>
      <g class="c-coral"><rect x="144" y="4" width="64" height="36" rx="6"/><text class="t" x="176" y="22" text-anchor="middle" dominant-baseline="central">coral</text></g>
      <g class="c-pink"><rect x="216" y="4" width="64" height="36" rx="6"/><text class="t" x="248" y="22" text-anchor="middle" dominant-baseline="central">pink</text></g>
      <g class="c-gray"><rect x="288" y="4" width="64" height="36" rx="6"/><text class="t" x="320" y="22" text-anchor="middle" dominant-baseline="central">gray</text></g>
      <g class="c-blue"><rect x="360" y="4" width="64" height="36" rx="6"/><text class="t" x="392" y="22" text-anchor="middle" dominant-baseline="central">blue</text></g>
      <g class="c-green"><rect x="432" y="4" width="64" height="36" rx="6"/><text class="t" x="464" y="22" text-anchor="middle" dominant-baseline="central">green</text></g>
      <g class="c-amber"><rect x="504" y="4" width="64" height="36" rx="6"/><text class="t" x="536" y="22" text-anchor="middle" dominant-baseline="central">amber</text></g>
      <g class="c-red"><rect x="576" y="4" width="64" height="36" rx="6"/><text class="t" x="608" y="22" text-anchor="middle" dominant-baseline="central">red</text></g>
    </svg>
    <p class="lm-diagram__caption">rect／circle／ellipse 的 fill 與 stroke 綁 --ramp-&lt;name&gt;-fill／-stroke；.t／.th 用 -text、.ts 用 -text-small</p>
  </div>
</body>
</html>
